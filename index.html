<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EigenSys — AI, Data &amp; Software Engineering</title>
    <meta
      name="description"
      content="EigenSys is an AI and technology studio building intelligent software, machine learning systems, data solutions, automation and digital products."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="EigenSys" />
    <meta name="robots" content="index, follow" />
    <!-- Replace eigensys.dev with your real domain in the four places below. -->
    <link rel="canonical" href="https://eigensys.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EigenSys" />
    <meta property="og:title" content="EigenSys — AI, Data &amp; Software Engineering" />
    <meta
      property="og:description"
      content="A small, highly capable engineering team building AI systems, data platforms and software products. Based in India, working globally."
    />
    <meta property="og:url" content="https://eigensys.dev/" />
    <meta property="og:image" content="https://eigensys.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EigenSys — AI, Data &amp; Software Engineering" />
    <meta
      name="twitter:description"
      content="AI systems, data platforms and software products — engineered to work in production."
    />
    <meta name="twitter:image" content="https://eigensys.dev/og-image.png" />

    <!-- Fonts (Geist, Geist Mono) are self-hosted via @fontsource-variable — see src/main.jsx -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EigenSys",
        "url": "https://eigensys.dev",
        "email": "hello@eigensys.dev",
        "description": "AI and technology studio building intelligent software, machine learning systems, data solutions, automation and digital products.",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressCountry": "IN" },
        "knowsAbout": ["Artificial Intelligence", "Machine Learning", "Generative AI", "RAG", "Data Engineering", "Web Development"]
      }
    </script>

    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      try {
        var stored = localStorage.getItem('eigensys-theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        /* storage blocked — the CSS media query still handles it */
      }
    </script>
  </head>
  <body>
    <noscript>EigenSys builds AI systems, data platforms and software products. Contact: hello@eigensys.dev</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
